<script>
  const API_URL =
    'https://willowy-toffee-908bc8.netlify.app/.netlify/functions/adoptable-dogs';
  const POLL_INTERVAL_MS = 30 * 60 * 1000; // 30 minutes

  const SVG_CARET_LEFT = '<i class="ph ph-caret-left" aria-hidden="true"></i>';
  const SVG_CARET_RIGHT =
    '<i class="ph ph-caret-right" aria-hidden="true"></i>';

  // icon class per compat status (Phosphor ph-* names)
  const COMPAT_ICON = {
    yes: 'ph-check-circle',
    caveat: 'ph-check-circle',
    no: 'ph-x-circle',
    unknown: 'ph-question',
  };

  let allDogs = [];
  let filteredDogs = [];
  let currentFilter = 'all';
  let currentSort = 'name-asc';
  let searchTerm = '';

  // ── Utilities ──────────────────────────────────────────────────────────────
  function isTrainingGrad(dog) {
    return (dog.attributes || []).some((a) => {
      const pub = a.Publish;
      const isPublished =
        pub === true ||
        pub === 1 ||
        (typeof pub === 'string' && pub.toLowerCase() === 'yes');
      return (
        isPublished && (a.AttributeName || '').toLowerCase().includes('trained')
      );
    });
  }
  function calculateAge(ageInMonths) {
    if (!ageInMonths) return 'Age unknown';
    if (ageInMonths <= 0) return 'Under 1 month old';
    if (ageInMonths < 12)
      return `${ageInMonths} month${ageInMonths !== 1 ? 's' : ''}`;
    const years = Math.floor(ageInMonths / 12);
    const months = ageInMonths % 12;
    if (months === 0) return `${years} year${years !== 1 ? 's' : ''}`;
    return `${years}y ${months}m`;
  }

  function formatWeight(weightPounds) {
    if (!weightPounds) return null;
    const weight = parseFloat(weightPounds);
    return isNaN(weight) ? null : `${weight.toFixed(1)} lbs`;
  }

  function formatBreed(breedString) {
    if (!breedString) return 'Mixed Breed';
    return breedString
      .split('/')
      .map((breed) => {
        const parts = breed
          .trim()
          .split(',')
          .map((p) => p.trim());
        return parts.length === 2 ? `${parts[1]} ${parts[0]}` : breed.trim();
      })
      .join(' • ');
  }

  const SHELTERLUV_EMBED_ID = 'shelterluv_wrap_1748401771';
  const SHELTERLUV_ORG_PREFIX = 'LLRO';

  function shelterLuvAdoptUrl(id, internalId) {
    const animalId = `${SHELTERLUV_ORG_PREFIX}-A-${id}`;
    const params = new URLSearchParams({
      nid: internalId,
      iframeId: SHELTERLUV_EMBED_ID,
    });
    return `https://new.shelterluv.com/matchme/adopt/${animalId}?${params}`;
  }

  function mapDog(animal) {
    return {
      id: animal.ID,
      internalId: animal['Internal-ID'],
      adoptUrl: shelterLuvAdoptUrl(animal.ID, animal['Internal-ID']),
      name: animal.Name || 'Unknown',
      breed: formatBreed(animal.Breed),
      breedRaw: animal.Breed || 'Mixed Breed',
      age: animal.Age,
      ageDisplay: calculateAge(animal.Age),
      sex: animal.Sex || 'Unknown',
      weight: formatWeight(animal.CurrentWeightPounds),
      description: animal.Description || 'No description available.',
      coverPhoto: animal.CoverPhoto,
      photos: animal.Photos || [],
      videos: animal.Videos || [],
      status: animal.Status || '',
      inFoster: animal.InFoster || false,
      needsFoster: !animal.InFoster,
      associatedPerson: animal.AssociatedPerson || [],
      altered: animal.Altered,
      color: animal.Color,
      pattern: animal.Pattern,
      size: animal.Size,
      currentLocation: animal.CurrentLocation || {},
      locationState: (animal.CurrentLocation || {}).State || null,
      attributes: animal.Attributes || [],
      microchips: animal.Microchips || [],
      previousIds: animal.PreviousIds || [],
      adoptionFeeGroup: animal.AdoptionFeeGroup || [],
      dobUnixTime: animal.DOBUnixTime,
      lastIntakeUnixTime: animal.LastIntakeUnixTime,
      lastUpdatedUnixTime: animal.LastUpdatedUnixTime,
      litterGroupId: animal.LitterGroupId,
    };
  }

  // ── Data fetching ──────────────────────────────────────────────────────────

  async function fetchDogs() {
    const errorEl = document.getElementById('error');

    try {
      const response = await fetch(API_URL);
      if (!response.ok)
        throw new Error(`HTTP error! status: ${response.status}`);

      const data = await response.json();
      allDogs = data.dogs.filter((a) => a.Type === 'Dog').map(mapDog);

      if (allDogs.length === 0) {
        document.getElementById('noResults').style.display = 'block';
      } else {
        applyFiltersAndSort();
        const dogId = new URLSearchParams(window.location.search).get('dog');
        if (dogId) {
          const dog = allDogs.find((d) => d.id === dogId);
          if (dog) openDogModal(dog);
        }
      }
    } catch (error) {
      console.error('Error fetching dogs:', error);
      errorEl.textContent = `Failed to load dogs: ${error.message}`;
      errorEl.style.display = 'block';
    }
  }

  // Silently refresh data in the background without disrupting the UI.
  async function silentRefresh() {
    try {
      const response = await fetch(API_URL);
      if (!response.ok) return;
      const data = await response.json();
      allDogs = data.dogs.filter((a) => a.Type === 'Dog').map(mapDog);
      applyFiltersAndSort();
    } catch (e) {
      // Swallow errors — don't disrupt the user on background refreshes.
    }
  }

  // ── Filtering & rendering ──────────────────────────────────────────────────

  function applyFiltersAndSort() {
    filteredDogs = allDogs.filter((dog) => {
      let passes = true;

      if (currentFilter === 'needs-foster') passes = dog.needsFoster;
      else if (currentFilter === 'in-foster') passes = dog.inFoster;
      else if (currentFilter === 'male')
        passes = dog.sex && dog.sex.toLowerCase() === 'male';
      else if (currentFilter === 'female')
        passes = dog.sex && dog.sex.toLowerCase() === 'female';

      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        passes =
          passes &&
          (dog.name.toLowerCase().includes(q) ||
            dog.breed.toLowerCase().includes(q));
      }

      return passes;
    });

    filteredDogs.sort((a, b) => {
      switch (currentSort) {
        case 'name-asc':
          return a.name.localeCompare(b.name);
        case 'name-desc':
          return b.name.localeCompare(a.name);
        case 'age-asc':
          return (a.age || 0) - (b.age || 0);
        case 'age-desc':
          return (b.age || 0) - (a.age || 0);
        case 'intake-asc':
          return (a.lastIntakeUnixTime || 0) - (b.lastIntakeUnixTime || 0);
        case 'intake-desc':
          return (b.lastIntakeUnixTime || 0) - (a.lastIntakeUnixTime || 0);
        case 'time-in-rescue-asc':
          return (b.lastIntakeUnixTime || 0) - (a.lastIntakeUnixTime || 0);
        case 'time-in-rescue-desc':
          return (a.lastIntakeUnixTime || 0) - (b.lastIntakeUnixTime || 0);
        default:
          return 0;
      }
    });

    updateResultsCount();
    renderDogs();
  }

  function updateResultsCount() {
    const countEl = document.getElementById('resultsCount');
    const noResultsEl = document.getElementById('noResults');

    if (filteredDogs.length > 0) {
      countEl.textContent = `Showing ${filteredDogs.length} dog${filteredDogs.length !== 1 ? 's' : ''}`;
      countEl.style.display = 'block';
      noResultsEl.style.display = 'none';
    } else {
      countEl.style.display = 'none';
      noResultsEl.style.display = 'block';
    }
  }

  function renderDogs() {
    const grid = document.getElementById('dogCardsGrid');
    grid.innerHTML = '';

    filteredDogs.forEach((dog) => {
      const card = document.createElement('div');
      card.className =
        'overlay-card' + (dog.needsFoster ? ' needs-foster' : '');
      card.setAttribute('role', 'article');
      card.setAttribute('aria-label', `${dog.name}, ${dog.breed}`);
      card.setAttribute('tabindex', '0');

      if (dog.needsFoster) {
        const badge = document.createElement('div');
        badge.className = 'foster-badge';
        badge.textContent = 'Needs Foster';
        badge.setAttribute('aria-label', 'This dog needs a foster home');
        card.appendChild(badge);
      }

      if (dog.coverPhoto) {
        const img = document.createElement('img');
        img.className = 'overlay-card-image';
        img.src = dog.coverPhoto;
        img.alt = `Photo of ${dog.name}`;
        img.loading = 'lazy';
        img.onerror = function () {
          this.style.display = 'none';
          const placeholder = document.createElement('div');
          placeholder.className = 'image-placeholder';
          placeholder.textContent = '🐕';
          card.appendChild(placeholder);
        };
        card.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'image-placeholder';
        placeholder.textContent = '🐕';
        card.appendChild(placeholder);
      }

      const content = document.createElement('div');
      content.className = 'overlay-card-content';

      const name = document.createElement('h3');
      name.className = 'overlay-card-name';
      name.textContent = dog.name;

      const breed = document.createElement('div');
      breed.className = 'overlay-card-breed';
      breed.textContent = dog.breed;

      const infoRow = document.createElement('div');
      infoRow.className = 'info-row';

      const ageBadge = document.createElement('span');
      ageBadge.className = 'info-badge';
      ageBadge.textContent = dog.ageDisplay;
      ageBadge.setAttribute('aria-label', `Age: ${dog.ageDisplay}`);
      infoRow.appendChild(ageBadge);

      const sexBadge = document.createElement('span');
      sexBadge.className = 'info-badge';
      sexBadge.textContent = dog.sex;
      sexBadge.setAttribute('aria-label', `Sex: ${dog.sex}`);
      infoRow.appendChild(sexBadge);

      if (dog.locationState) {
        const stateBadge = document.createElement('span');
        stateBadge.className = 'info-badge';
        stateBadge.textContent = dog.locationState;
        stateBadge.setAttribute('aria-label', `Location: ${dog.locationState}`);
        infoRow.appendChild(stateBadge);
      }

      if (isTrainingGrad(dog)) {
        const trainedBadge = document.createElement('span');
        trainedBadge.className = 'info-badge info-badge-trained';
        trainedBadge.innerHTML =
          '<i class="ph-fill ph-graduation-cap" aria-hidden="true"></i> Training Grad';
        trainedBadge.setAttribute('aria-label', 'Training graduate');
        infoRow.appendChild(trainedBadge);
      }

      const description = document.createElement('div');
      description.className = 'overlay-card-description';
      description.textContent = dog.description;

      content.appendChild(name);
      content.appendChild(breed);
      content.appendChild(infoRow);
      content.appendChild(description);

      card.appendChild(content);
      card.addEventListener('click', () => openDogModal(dog));
      card.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openDogModal(dog);
        }
      });

      grid.appendChild(card);
    });
  }

  // ── Modal ──────────────────────────────────────────────────────────────────

  function openDogModal(dog) {
    const modal = document.getElementById('dogModal');
    const modalCarousel = document.getElementById('modalCarousel');
    const modalPanelHeader = document.getElementById('modalPanelHeader');
    const modalBody = document.getElementById('modalBody');
    const modalActions = document.getElementById('modalActions');

    modalCarousel.innerHTML = '';
    modalPanelHeader.innerHTML = '';
    modalBody.innerHTML = '';
    modalActions.innerHTML = '';

    // ── Build carousel (left panel) ──────────────────────────────

    const allPhotos =
      dog.photos && dog.photos.length > 0
        ? dog.photos
        : dog.coverPhoto
          ? [dog.coverPhoto]
          : [];

    let activeIndex = 0;

    const carouselMain = document.createElement('div');
    carouselMain.className = 'modal-carousel-main';

    let mainImg;
    if (allPhotos.length > 0) {
      mainImg = document.createElement('img');
      mainImg.className = 'modal-carousel-img';
      mainImg.src = allPhotos[0];
      mainImg.alt = `Photo of ${dog.name}`;
      carouselMain.appendChild(mainImg);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'modal-image-placeholder';
      placeholder.textContent = '🐕';
      carouselMain.appendChild(placeholder);
    }

    // Prev/next buttons
    let prevBtn,
      nextBtn,
      thumbnailBtns = [];
    if (allPhotos.length > 1) {
      prevBtn = document.createElement('button');
      prevBtn.className = 'modal-carousel-btn modal-carousel-btn-prev';
      prevBtn.setAttribute('aria-label', 'Previous photo');
      prevBtn.innerHTML = SVG_CARET_LEFT;
      prevBtn.disabled = true;
      carouselMain.appendChild(prevBtn);

      nextBtn = document.createElement('button');
      nextBtn.className = 'modal-carousel-btn modal-carousel-btn-next';
      nextBtn.setAttribute('aria-label', 'Next photo');
      nextBtn.innerHTML = SVG_CARET_RIGHT;
      carouselMain.appendChild(nextBtn);
    }

    modalCarousel.appendChild(carouselMain);

    // Thumbnail strip with arrow nav
    if (allPhotos.length > 1) {
      const thumbWrapper = document.createElement('div');
      thumbWrapper.className = 'modal-thumbnails-wrapper';

      const thumbPrevBtn = document.createElement('button');
      thumbPrevBtn.className = 'modal-thumb-arrow modal-thumb-arrow-prev';
      thumbPrevBtn.setAttribute('aria-label', 'Scroll thumbnails left');
      thumbPrevBtn.disabled = true;
      thumbPrevBtn.innerHTML = SVG_CARET_LEFT;

      const thumbStrip = document.createElement('div');
      thumbStrip.className = 'modal-thumbnails';

      const thumbNextBtn = document.createElement('button');
      thumbNextBtn.className = 'modal-thumb-arrow modal-thumb-arrow-next';
      thumbNextBtn.setAttribute('aria-label', 'Scroll thumbnails right');
      thumbNextBtn.innerHTML = SVG_CARET_RIGHT;

      allPhotos.forEach((url, i) => {
        const btn = document.createElement('button');
        btn.className = 'modal-thumbnail' + (i === 0 ? ' active' : '');
        btn.setAttribute('aria-label', `View photo ${i + 1}`);
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        btn.appendChild(img);
        btn.addEventListener('click', () => goTo(i));
        thumbStrip.appendChild(btn);
        thumbnailBtns.push(btn);
      });

      const THUMB_SCROLL = 120; // ~2 thumbnails per click

      function updateThumbArrows() {
        thumbPrevBtn.disabled = thumbStrip.scrollLeft <= 0;
        thumbNextBtn.disabled =
          thumbStrip.scrollLeft >=
          thumbStrip.scrollWidth - thumbStrip.clientWidth - 1;
      }

      thumbPrevBtn.addEventListener('click', () => {
        thumbStrip.scrollBy({ left: -THUMB_SCROLL, behavior: 'smooth' });
        setTimeout(updateThumbArrows, 320);
      });
      thumbNextBtn.addEventListener('click', () => {
        thumbStrip.scrollBy({ left: THUMB_SCROLL, behavior: 'smooth' });
        setTimeout(updateThumbArrows, 320);
      });
      thumbStrip.addEventListener('scroll', updateThumbArrows);

      thumbWrapper.appendChild(thumbPrevBtn);
      thumbWrapper.appendChild(thumbStrip);
      thumbWrapper.appendChild(thumbNextBtn);
      modalCarousel.appendChild(thumbWrapper);

      // Init arrow state after layout
      requestAnimationFrame(updateThumbArrows);
    }

    function goTo(index) {
      activeIndex = index;
      if (mainImg) {
        mainImg.src = allPhotos[activeIndex];
        mainImg.alt = `Photo ${activeIndex + 1} of ${dog.name}`;
      }
      thumbnailBtns.forEach((btn, i) =>
        btn.classList.toggle('active', i === activeIndex),
      );
      if (prevBtn) prevBtn.disabled = activeIndex === 0;
      if (nextBtn) nextBtn.disabled = activeIndex === allPhotos.length - 1;
    }

    if (prevBtn)
      prevBtn.addEventListener('click', () =>
        goTo(Math.max(activeIndex - 1, 0)),
      );
    if (nextBtn)
      nextBtn.addEventListener('click', () =>
        goTo(Math.min(activeIndex + 1, allPhotos.length - 1)),
      );

    // ── Build right panel header (name + breed + foster badge) ────

    const nameRow = document.createElement('div');
    nameRow.className = 'modal-name-row';

    const nameEl = document.createElement('h3');
    nameEl.className = 'modal-dog-name';
    nameEl.textContent = dog.name;
    nameRow.appendChild(nameEl);

    if (dog.needsFoster) {
      const badge = document.createElement('div');
      badge.className = 'modal-foster-badge';
      badge.textContent = 'Needs Foster';
      nameRow.appendChild(badge);
    }

    modalPanelHeader.appendChild(nameRow);

    if (dog.breed) {
      const breedEl = document.createElement('div');
      breedEl.className = 'modal-dog-breed';
      breedEl.textContent = dog.breed;
      modalPanelHeader.appendChild(breedEl);
    }

    // ── Info grid (label / value pairs) ──────────────────────────

    const infoGrid = document.createElement('div');
    infoGrid.className = 'modal-info-grid';

    const gridItems = [
      { label: 'Age', value: dog.ageDisplay },
      { label: 'Sex', value: dog.sex || 'Unknown' },
      ...(dog.weight ? [{ label: 'Weight', value: dog.weight }] : []),
      { label: 'Altered', value: dog.altered === 'Yes' ? 'Yes' : 'No' },
      ...(dog.lastIntakeUnixTime
        ? [
            {
              label: 'Intake Date',
              value: new Date(dog.lastIntakeUnixTime * 1000).toLocaleDateString(
                'en-US',
                { month: 'short', day: 'numeric', year: 'numeric' },
              ),
            },
          ]
        : []),
      ...(dog.DOBUnixTime
        ? [
            {
              label: 'Date of Birth',
              value: new Date(dog.lastIntakeUnixTime * 1000).toLocaleDateString(
                'en-US',
                { month: 'short', day: 'numeric', year: 'numeric' },
              ),
            },
          ]
        : []),
      ...(dog.color
        ? [{ label: 'Color', value: dog.color.replace(/\//g, ' & ') }]
        : []),
    ];

    gridItems.forEach(({ label, value }) => {
      const item = document.createElement('div');
      item.className = 'modal-info-item';
      const lbl = document.createElement('div');
      lbl.className = 'modal-info-label';
      lbl.textContent = label;
      const val = document.createElement('div');
      val.className = 'modal-info-value';
      val.textContent = value;
      item.appendChild(lbl);
      item.appendChild(val);
      infoGrid.appendChild(item);
    });

    modalBody.appendChild(infoGrid);

    // ── Compatibility row (Dogs / Cats / Kids) ────────────────────
    {
      const attrs = dog.attributes || [];
      const hasAttr = (...keywords) =>
        attrs.some((a) => {
          const pub = a.Publish;
          const isPublished =
            pub === true ||
            pub === 1 ||
            (typeof pub === 'string' && pub.toLowerCase() === 'yes');
          if (!isPublished) return false;
          return keywords.some((k) =>
            (a.AttributeName || '').toLowerCase().includes(k.toLowerCase()),
          );
        });

      // Dogs: yes / no / male-preferred / female-preferred / unknown
      let dogsType,
        dogsNote = null;
      if (hasAttr('not good with dog', 'no dog')) {
        dogsType = 'no';
      } else if (hasAttr('male dog home preferred')) {
        dogsType = 'caveat';
        dogsNote = 'ph-gender-male';
      } else if (hasAttr('female dog home preferred')) {
        dogsType = 'caveat';
        dogsNote = 'ph-gender-female';
      } else if (hasAttr('good with dog')) {
        dogsType = 'yes';
      } else {
        dogsType = 'yes';
      }

      // Cats
      let catsType;
      if (hasAttr('not good with cats')) catsType = 'no';
      else if (hasAttr('good with cats')) catsType = 'yes';
      else catsType = 'unknown';

      // Kids
      let kidsType,
        kidsNote = null;
      if (hasAttr('not good with kids')) {
        kidsType = 'no';
      } else if (
        hasAttr('older-child home preferred', 'adult-only home preferred')
      ) {
        kidsType = 'caveat';
        kidsNote = 'Adults preferred';
      } else if (hasAttr('good with kids')) {
        kidsType = 'yes';
      } else {
        kidsType = 'yes';
      }

      const compatRow = document.createElement('div');
      compatRow.className = 'modal-compat';

      const compatHeading = document.createElement('h2');
      compatHeading.className = 'modal-section-title';
      compatHeading.textContent = 'Good with';
      compatRow.appendChild(compatHeading);

      const iconsRow = document.createElement('div');
      iconsRow.className = 'modal-compat-icons';

      const STATUS_ICON = {
        yes: 'ph-check',
        no: 'ph-x',
        caveat: 'ph-warning',
      };

      [
        { phIcon: 'ph-dog', label: 'Dogs', type: dogsType, note: dogsNote },
        { phIcon: 'ph-cat', label: 'Cats', type: catsType, note: null },
        { phIcon: 'ph-baby', label: 'Kids', type: kidsType, note: kidsNote },
      ].forEach(({ phIcon, label, type, note }) => {
        // Column 1: animal icon
        const animalIcon = document.createElement('i');
        animalIcon.className = `ph ${phIcon} modal-compat-animal`;
        animalIcon.setAttribute('aria-hidden', 'true');
        iconsRow.appendChild(animalIcon);

        // Column 2: label
        const labelEl = document.createElement('span');
        labelEl.className = 'modal-compat-label';
        labelEl.textContent = label;
        iconsRow.appendChild(labelEl);

        // Column 2: status icon
        let statusEl;
        if (type === 'unknown') {
          statusEl = document.createElement('span');
          statusEl.textContent = '?';
        } else {
          statusEl = document.createElement('i');
          statusEl.className = `ph ${STATUS_ICON[type]}`;
          statusEl.setAttribute('aria-hidden', 'true');
        }
        statusEl.classList.add(
          'modal-compat-status',
          `modal-compat-status--${type}`,
        );
        iconsRow.appendChild(statusEl);

        // Column 3: caveat note icon (empty span otherwise)
        if (note) {
          const noteEl = document.createElement('i');
          noteEl.className = `ph ${note} modal-compat-note-icon`;
          noteEl.setAttribute('aria-hidden', 'true');
          iconsRow.appendChild(noteEl);
        } else {
          iconsRow.appendChild(document.createElement('span'));
        }
      });

      compatRow.appendChild(iconsRow);
      modalBody.appendChild(compatRow);
    }

    // Attributes
    if (dog.attributes && dog.attributes.length > 0) {
      const COMPAT_ATTR_EXCLUDE = [
        'adult-only home preferred',
        'good with cats',
        'not good with cats',
        'good with kids',
        'good with children',
        'not good with dogs',
        'good with dogs',
        'female dog home preferred',
        'male dog home preferred',
        'trained',
      ];
      const published = dog.attributes.filter((a) => {
        if (a.Publish !== 'Yes') return false;
        const name = a.AttributeName.toLowerCase();
        return !COMPAT_ATTR_EXCLUDE.some((ex) => name.includes(ex));
      });
      if (published.length > 0) {
        const section = document.createElement('div');
        section.className = 'modal-section';
        section.innerHTML =
          '<h2 class="modal-section-title">What makes me special</h2>';
        const container = document.createElement('div');
        container.className = 'modal-attributes';
        published.forEach((attr) => {
          const tag = document.createElement('span');
          tag.className = 'modal-attribute-tag';
          tag.textContent = attr.AttributeName.toLowerCase();
          container.appendChild(tag);
        });
        section.appendChild(container);
        modalBody.appendChild(section);
      }
    }

    // Description — textContent keeps it XSS-safe; pre-wrap handles line breaks
    if (dog.description) {
      const section = document.createElement('div');
      section.className = 'modal-section';
      const title = document.createElement('h2');
      title.className = 'modal-section-title';
      title.textContent = `About ${dog.name}`;
      const desc = document.createElement('p');
      desc.className = 'modal-description';
      desc.textContent = dog.description;
      section.appendChild(title);
      section.appendChild(desc);
      modalBody.appendChild(section);
    }

    // Foster info
    if (
      dog.inFoster &&
      dog.associatedPerson &&
      dog.associatedPerson.length > 0
    ) {
      const fosterPerson = dog.associatedPerson.find(
        (p) => p.RelationshipType === 'foster',
      );
      if (fosterPerson) {
        const fosterDate = fosterPerson.OutDateUnixTime
          ? new Date(fosterPerson.OutDateUnixTime * 1000).toLocaleDateString(
              'en-US',
              { year: 'numeric', month: 'long', day: 'numeric' },
            )
          : 'Unknown';
        const section = document.createElement('div');
        section.className = 'modal-section';
        section.innerHTML = `
          <h2 class="modal-section-title">Foster Information</h2>
          <div class="modal-foster-info">
            <div class="modal-foster-name">Foster Parent: ${fosterPerson.FirstName} ${fosterPerson.LastName}</div>
            <div class="modal-foster-date">In foster since: ${fosterDate}</div>
          </div>
        `;
        modalBody.appendChild(section);
      }
    }

    // Adoption Fee
    if (dog.adoptionFeeGroup && dog.adoptionFeeGroup.length > 0) {
      const feeGroup = dog.adoptionFeeGroup[0];
      const totalFee =
        (feeGroup.Price || 0) - (feeGroup.Discount || 0) + (feeGroup.Tax || 0);
      const section = document.createElement('div');
      section.className = 'modal-section';
      section.innerHTML = '<h2 class="modal-section-title">Adoption Fee</h2>';

      const feeGrid = document.createElement('div');
      feeGrid.className = 'modal-fee-grid';

      const feeItems = [
        { label: 'Fee Group', value: feeGroup.Name, highlight: false },
        {
          label: 'Base Price',
          value: `$${feeGroup.Price || 0}`,
          highlight: false,
        },
        ...(feeGroup.Discount
          ? [
              {
                label: 'Discount',
                value: `-$${feeGroup.Discount}`,
                highlight: false,
              },
            ]
          : []),
        { label: 'Total Fee', value: `$${totalFee}`, highlight: true },
      ];

      feeItems.forEach((item) => {
        const el = document.createElement('div');
        el.className = item.highlight
          ? 'modal-fee-item highlight'
          : 'modal-fee-item';
        el.innerHTML = `
          <div class="modal-fee-label">${item.label}</div>
          <div class="modal-fee-value ${item.highlight ? 'highlight-text' : ''}">${item.value}</div>
        `;
        feeGrid.appendChild(el);
      });

      section.appendChild(feeGrid);
      modalBody.appendChild(section);
    }

    // ── Action buttons ────────────────────────────────────────────

    const adoptBtn = document.createElement('button');
    adoptBtn.className = 'primary-btn modal-btn modal-btn-adopt';
    adoptBtn.textContent = 'Apply to Adopt →';
    adoptBtn.onclick = () => handleAdoptApplication(dog);
    modalActions.appendChild(adoptBtn);

    if (dog.needsFoster) {
      const fosterBtn = document.createElement('button');
      fosterBtn.className = 'secondary-btn modal-btn modal-btn-foster';
      fosterBtn.textContent = 'Apply to Foster →';
      fosterBtn.onclick = () => handleFosterApplication(dog);
      modalActions.appendChild(fosterBtn);
    }

    if (isTrainingGrad(dog)) {
      const trainedChip = document.createElement('div');
      trainedChip.className = 'modal-trained-badge';
      trainedChip.innerHTML =
        '<i class="ph-fill ph-graduation-cap" aria-hidden="true"></i><span>Training Program Graduate</span>';
      modalPanelHeader.appendChild(trainedChip);
    }

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    document.body.classList.add('dog-modal-open');

    const url = new URL(window.location.href);
    url.searchParams.set('dog', dog.id);
    history.pushState({ dogId: dog.id }, '', url);
  }

  function closeDogModal() {
    document.getElementById('dogModal').classList.remove('active');
    document.body.style.overflow = 'auto';
    document.body.classList.remove('dog-modal-open');

    const url = new URL(window.location.href);
    url.searchParams.delete('dog');
    history.pushState({}, '', url);
  }

  function handleFosterApplication(dog) {
    window.open(
      'https://new.shelterluv.com/matchme/foster/LLRO/Dog',
      '_blank',
      'noopener,noreferrer',
    );
  }

  function handleAdoptApplication(dog) {
    window.open(dog.adoptUrl, '_blank', 'noopener,noreferrer');
  }

  // ── Event listeners ────────────────────────────────────────────────────────

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    applyFiltersAndSort();
  });

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach((b) => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      e.target.classList.add('active');
      e.target.setAttribute('aria-pressed', 'true');
      currentFilter = e.target.dataset.filter;
      applyFiltersAndSort();
    });
  });

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    currentSort = e.target.value;
    applyFiltersAndSort();
  });

  // ── Custom sort dropdown ───────────────────────────────────────────────────
  (function () {
    const dropdown = document.getElementById('customSort');
    const trigger = dropdown.querySelector('.custom-select-trigger');
    const label = document.getElementById('customSortLabel');
    const options = dropdown.querySelectorAll('.custom-select-option');

    trigger.addEventListener('click', () => {
      const isOpen = dropdown.classList.toggle('open');
      trigger.setAttribute('aria-expanded', isOpen);
    });

    options.forEach((opt) => {
      opt.addEventListener('click', () => {
        options.forEach((o) => o.classList.remove('selected'));
        opt.classList.add('selected');
        label.textContent = opt.textContent;
        currentSort = opt.dataset.value;
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
        applyFiltersAndSort();
      });
    });

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  document
    .getElementById('modalClose')
    .addEventListener('click', closeDogModal);

  document.getElementById('modalLinkBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.getElementById('modalLinkBtn');
      const icon = btn.querySelector('i');
      icon.className = 'ph ph-check';
      btn.classList.add('modal-link-btn--copied');
      setTimeout(() => {
        icon.className = 'ph ph-link';
        btn.classList.remove('modal-link-btn--copied');
      }, 1800);
    });
  });

  document.getElementById('dogModal').addEventListener('click', (e) => {
    if (e.target.id === 'dogModal') closeDogModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDogModal();
    if (!document.getElementById('dogModal').classList.contains('active'))
      return;
    if (e.key === 'ArrowRight') {
      const nextBtn = document.querySelector('.modal-carousel-btn-next');
      if (nextBtn && !nextBtn.disabled) nextBtn.click();
    }
    if (e.key === 'ArrowLeft') {
      const prevBtn = document.querySelector('.modal-carousel-btn-prev');
      if (prevBtn && !prevBtn.disabled) prevBtn.click();
    }
  });

  window.addEventListener('popstate', (e) => {
    const dogId = e.state && e.state.dogId;
    if (dogId) {
      const dog = allDogs.find((d) => d.id === dogId);
      if (dog) {
        openDogModal(dog);
        return;
      }
    }
    const modal = document.getElementById('dogModal');
    if (modal.classList.contains('active')) {
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
      document.body.classList.remove('dog-modal-open');
    }
  });

  // ── Boot ───────────────────────────────────────────────────────────────────

  // Move modal to document.body so it escapes any Squarespace stacking context
  // that would allow page elements to render on top of it.
  document.body.appendChild(document.getElementById('dogModal'));

  fetchDogs();
  setInterval(silentRefresh, POLL_INTERVAL_MS);
</script>
